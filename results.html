<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pearl Anniversary Quiz Results</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            color: #333;
            background: #fffdf7;
        }

        .results-sheet {
            border: 4px solid #d4af37;
            padding: 30px;
            border-radius: 15px;
            background: white;
        }

        h1 {
            color: #8a6515;
            text-align: center;
            font-size: 1.8rem;
        }

        .score {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #8a6515;
            margin: 20px 0;
        }

        .question-result {
            border-bottom: 1px solid #ccc;
            padding: 15px 0;
            page-break-inside: avoid;
        }

        .question-result h3 {
            color: #8a6515;
        }

        .correct {
            color: #198754;
            font-weight: bold;
        }

        .incorrect {
            color: #b02a37;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-style: italic;
        }

        .results-buttons {
            text-align: center;
            margin: 25px 0;
        }

        button {
            margin: 6px;
            padding: 12px 22px;
            font-size: 17px;
            cursor: pointer;
        }

        .no-results {
            text-align: center;
            font-size: 20px;
            margin-top: 50px;
        }

        @media print {

            .results-buttons {
                display: none;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .results-sheet {
                border: none;
            }
        }

    </style>
</head>

<body>

    <div id="resultsContainer"></div>

    <script>

        const savedResults =
            localStorage.getItem("pearlQuizResults");

        const container =
            document.getElementById("resultsContainer");

        if (!savedResults) {

            container.innerHTML = `
                <div class="no-results">
                    <h2>No quiz results were found.</h2>

                    <p>
                        Please return to the quiz and choose
                        Download My Results again.
                    </p>

                    <button onclick="window.close()">
                        ← Return to Quiz
                    </button>
                </div>
            `;

        } else {

            const data = JSON.parse(savedResults);

            let questionResults = "";

            data.results.forEach((result, index) => {

    if (result.type === "game") {

        questionResults += `
            <div class="question-result">

                <h3>
                    Challenge ${index + 1}: ${result.name}
                </h3>

                <p class="${result.result === "cocktail"
                    ? "correct"
                    : "incorrect"}">

                    ${result.result === "cocktail"
                        ? "🍹 Cocktail"
                        : "🥥 Coconut"}

                </p>

            </div>
        `;

    } else {

        questionResults += `
            <div class="question-result">

                <h3>
                    Challenge ${index + 1}: ${result.question}
                </h3>

                <p>
                    <strong>Your answer:</strong>
                    ${result.selectedAnswer}
                </p>

                <p>
                    <strong>Correct answer:</strong>
                    ${result.correctAnswer}
                </p>

                <p class="${result.result === "cocktail"
                    ? "correct"
                    : "incorrect"}">

                    ${result.result === "cocktail"
                        ? "🍹 Cocktail"
                        : "🥥 Coconut"}

                </p>

            </div>
        `;
    }
});

            container.innerHTML = `

                <div class="results-sheet">

                    <h1>
                        🥂 Louise & Steve’s
                        Pearl Anniversary Challenge 🥂
                    </h1>

                    <div class="score">

                        ${data.playerName}<br>

                        🍹 ${data.cocktails}
                        ${data.cocktails === 1 ? "Cocktail" : "Cocktails"}
                        &nbsp; · &nbsp;
                        🥥 ${data.coconuts}
                        ${data.coconuts === 1 ? "Coconut" : "Coconuts"}

                    </div>

                    ${questionResults}

                    <div class="footer">

                        🤍 Thank you for celebrating
                        Louise & Steve’s<br>
                        Pearl Wedding Anniversary.

                    </div>

                </div>

                <div class="results-buttons">

                    <button onclick="window.print()">
                        🖨️ Print / Save as PDF
                    </button>

                    <button onclick="window.close()">
                        ← Return to Quiz
                    </button>

                </div>
            `;
        }

    </script>

</body>

</html>
